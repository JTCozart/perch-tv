name: Perch / Release

# Pushing a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) tests the code, builds a signed APK and
# publishes it as a GitHub release. The website's download button always points at the latest release's APK.
on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    name: Test, build and publish
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # A failing test publishes nothing
      - name: Run tests
        run: ./gradlew test

      - name: Decode signing key
        env:
          PERCH_KEYSTORE: ${{ secrets.PERCH_KEYSTORE }}
        run: |
          if [ -z "$PERCH_KEYSTORE" ]; then
            echo "The PERCH_KEYSTORE secret is missing, so a signed release cannot be built." >&2
            exit 1
          fi
          echo "$PERCH_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/perch.jks"

      - name: Build signed release APK
        env:
          PERCH_VERSION: ${{ github.ref_name }}
          KEYSTORE_FILE: ${{ runner.temp }}/perch.jks
          KEYSTORE_PASSWORD: ${{ secrets.PERCH_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.PERCH_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PERCH_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Collect release files
        run: |
          mkdir -p release
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -s "$apk"
          cp "$apk" "release/perch-tv-${GITHUB_REF_NAME}.apk"
          # A fixed name, so the website can link to the newest download without knowing the version
          cp "$apk" release/perch-tv.apk
          (cd release && sha256sum *.apk > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kind="--latest"
          case "$GITHUB_REF_NAME" in *-*) kind="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Perch $GITHUB_REF_NAME" \
            --generate-notes \
            $kind
